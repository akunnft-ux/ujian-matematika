<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Admin — Ujian Tes Kompetensi Akademik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
<div class="page">
  <header class="topbar">
    <div class="logo"><span class="mark">A</span> Dashboard Admin</div>
    <div class="userbox" id="userbox" style="display:none"><span id="userInfo"></span><button id="btnLogout" class="btn btn-ghost btn-sm" style="color:#fff; background:rgba(255,255,255,.12)"><i class="fa-solid fa-right-from-bracket"></i> Keluar</button></div>
  </header>

  <main class="container container-narrow" id="loginWrap">
    <div class="card card-login" style="margin-top:24px">
      <div class="hero">
        <div class="hero-mark">A</div>
        <div class="hero-icon"><i class="fa-solid fa-user-tie"></i></div>
        <h1 class="hero-title">Login Admin</h1>
        <p class="hero-sub">Kelola siswa, akun guru, dan monitoring ujian.</p>
      </div>
      <div class="card-body">
        <div style="width:100%; max-width:320px; margin:0 auto">
          <div class="field"><label>Username</label><input id="aUser" class="input" autocomplete="username" placeholder="username"></div>
          <div class="field"><label>Password</label><input id="aPass" class="input" type="password" autocomplete="current-password" placeholder="••••••••"></div>
          <button id="btnAdminLogin" class="btn btn-block" style="padding:13px">Masuk <i class="fa-solid fa-right-to-bracket"></i></button>
          <p id="adminMsg" class="muted" style="margin-top:10px; font-size:13px"></p>
        </div>
      </div>
    </div>
  </main>

  <main class="container hidden" id="dashWrap">
    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="monitor"><i class="fa-solid fa-radar"></i> Monitor</button>
      <button class="tab" data-tab="siswa"><i class="fa-solid fa-user-lock"></i> Reset Siswa</button>
      <button class="tab" data-tab="datasiswa"><i class="fa-solid fa-users"></i> Data Siswa</button>
      <button class="tab" data-tab="ujian"><i class="fa-solid fa-screwdriver-wrench"></i> Ujian</button>
      <button class="tab" data-tab="user"><i class="fa-solid fa-users-gear"></i> Guru</button>
      <button class="tab" data-tab="hasil"><i class="fa-solid fa-chart-column"></i> Hasil</button>
    </nav>

    <section id="tab-monitor" class="tab-panel">
      <div class="section-head"><h2>Monitoring</h2><button id="btnRefreshMonitor" class="btn btn-ghost">⟳ Refresh</button></div>
      <div class="flex" style="display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px;">
        <select id="monStatus" class="input" style="max-width:190px">
          <option value="">Semua status</option>
          <option value="ACTIVE">Sedang mengerjakan</option>
          <option value="SELESAI">Selesai</option>
          <option value="INACTIVE">Belum ujian</option>
        </select>
        <div class="input-icon-wrap" style="max-width:280px; flex:1 1 200px; min-width:170px;">
          <i class="fa-solid fa-magnifying-glass" style="position:absolute; left:14px; top:50%; transform:translateY(-50%); color:#94a3b8; font-size:14px;"></i>
          <input id="monCari" class="input" placeholder="Cari NIS / username / kode ujian...">
        </div>
      </div>
      <div id="monitorBox"></div>
    </section>

    <section id="tab-siswa" class="tab-panel hidden">
      <div class="section-head"><h2>Permintaan Reset Login</h2><button id="btnRefreshReset" class="btn btn-ghost">⟳ Refresh</button></div>
      <div id="siswaBox"></div>
    </section>

    <section id="tab-datasiswa" class="tab-panel hidden">
      <div class="section-head"><h2>Data Siswa</h2></div>
      <div class="card">
        <div class="flex" style="display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px;">
          <select id="dsKelas" class="input" style="max-width:180px"><option value="">Semua kelas</option></select>
          <div class="input-icon-wrap" style="max-width:260px; flex:1 1 200px; min-width:160px;">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input id="dsCari" class="input" placeholder="Cari nama / NIS / username...">
          </div>
          <button id="btnRefreshSiswa" class="btn btn-outline" style="margin-left:auto">⟳ Refresh</button>
          <button id="btnGenerateKartu" class="btn btn-success">Generate Kartu</button>
        </div>
        <div id="dsBox" class="table-wrap"></div>
        <!-- Modal Generate Kartu -->
        <div class="modal-overlay" id="kartuModal">
          <div class="modal" style="max-width:720px">
            <div class="modal-header">
              <h3>Generate Kartu Siswa</h3>
              <button class="modal-close" id="kartuClose">×</button>
            </div>
            <div class="modal-body" style="display:flex; flex-direction:column; gap:12px">
              <div style="display:flex; align-items:center; gap:8px; font-size:13px; color:var(--slate-600)">
                <label for="kartuNama">Nama Ujian:</label>
                <input id="kartuNama" class="input" placeholder="Ujian Matematika" style="flex:1">
              </div>
              <div style="display:flex; align-items:center; gap:8px; font-size:13px; color:var(--slate-600)">
                <label for="kartuJumlah">Kartu per halaman:</label>
                <select id="kartuJumlah" style="padding:4px 8px; border-radius:6px">
                  <option value="6">6 kartu</option>
                  <option value="8">8 kartu</option>
                  <option value="10">10 kartu</option>
                </select>
              </div>
              <div id="kartuFilterInfo" class="mt card" style="font-size:13px"></div>
              <div id="kartuPreview" class="mt" style="min-height:120px"></div>
              <div id="kartuPrintArea" class="print-area kartu-grid kartu-grid--6"></div>
            </div>
            <div class="modal-footer" style="justify-content:space-between">
              <button id="kartuGenerate" class="btn btn-success">Generate & Simpan</button>
              <button id="kartuCetak" class="btn btn-primary" style="display:none">Cetak / Simpan PDF</button>
              <button id="kartuCancel" class="btn btn-ghost">Batal</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section id="tab-ujian" class="tab-panel hidden">
      <div class="section-head"><h2>Aktifkan Ujian &amp; Token</h2></div>
      <div id="ujianBox"></div>
    </section>

    <section id="tab-user" class="tab-panel hidden">
      <div class="card">
        <h3 class="card-title">Tambah Akun Guru</h3>
        <p class="card-sub">Guru hanya dapat login &amp; mengelola soal setelah akun dibuat di sini.</p>
        <div class="grid grid-2">
          <div class="field"><label>Username</label><input id="nuUser" class="input"></div>
          <div class="field"><label>Password</label><input id="nuPass" class="input" type="password"></div>
        </div>
        <button id="btnTambahUser" class="btn">Tambah Guru</button>
      </div>
      <div class="card">
        <h3 class="card-title">Daftar Guru</h3>
        <div id="userList" class="table-wrap"></div>
      </div>
    </section>

    <section id="tab-hasil" class="tab-panel hidden">
      <div class="section-head"><h2>Hasil Ujian</h2></div>
      <div class="card">
        <div class="flex" style="display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px;">
          <select id="hfKode" class="input" style="max-width:180px"><option value="">Semua kode ujian</option></select>
          <select id="hfKelas" class="input" style="max-width:160px"><option value="">Semua kelas</option></select>
          <div class="input-icon-wrap" style="max-width:240px; flex:1 1 180px; min-width:150px;">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input id="hfCari" class="input" placeholder="Cari nama siswa...">
          </div>
          <button id="btnExportHasil" class="btn btn-outline" style="margin-left:auto"><i class="fa-solid fa-file-excel"></i> Export XLS</button>
        </div>
        <div id="hasilBox" class="table-wrap"></div>
      </div>
    </section>
  </main>
</div>

<script src="js/config.js?v=2"></script>
<script src="js/auth.js?v=2"></script>
<script src="js/api.js?v=2"></script>
<script>
(function () {
  "use strict";
  AppAPI.initMock();

  var wrapLogin = document.getElementById("loginWrap");
  var wrapDash = document.getElementById("dashWrap");
  var userbox = document.getElementById("userbox");

  function toast(msg) {
    var t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
    document.body.appendChild(t);
    requestAnimationFrame(function () { t.classList.add("show"); });
    setTimeout(function () { t.classList.remove("show"); setTimeout(function () { t.remove(); }, 300); }, 2000);
  }

  function masukDashboard(data) {
    AppSession.save({ role: data.role, username: data.username, sessionId: data.sessionId });
    document.getElementById("userInfo").innerHTML = '<i class="fa-solid fa-user-shield"></i> ' + esc(data.username);
    userbox.style.display = "";
    wrapLogin.classList.add("hidden");
    wrapDash.classList.remove("hidden");
    muatMonitor();
  }

  document.getElementById("btnAdminLogin").addEventListener("click", loginAdmin);
  document.getElementById("aPass").addEventListener("keydown", function (e) { if (e.key === "Enter") loginAdmin(); });

  function loginAdmin() {
    var u = document.getElementById("aUser").value.trim();
    var p = document.getElementById("aPass").value;
    if (!u || !p) { document.getElementById("adminMsg").textContent = "Isi username & password."; return; }
    document.getElementById("btnAdminLogin").disabled = true;
    document.getElementById("adminMsg").textContent = "Memeriksa...";
    AppAPI.call("login-admin", { username: u, password: p }).then(function (res) {
      document.getElementById("btnAdminLogin").disabled = false;
      if (!res.ok) { document.getElementById("adminMsg").textContent = res.error; return; }
      if (res.data.role !== "admin") {
        document.getElementById("adminMsg").textContent = "Halaman ini khusus admin.";
        return;
      }
      masukDashboard(res.data);
    }).catch(function (err) {
      document.getElementById("btnAdminLogin").disabled = false;
      document.getElementById("adminMsg").textContent = err.message;
    });
  }

  document.getElementById("btnLogout").addEventListener("click", function () { AppSession.clear(); location.reload(); });

  document.getElementById("tabs").addEventListener("click", function (e) {
    var btn = e.target.closest(".tab"); if (!btn) return;
    document.querySelectorAll(".tab").forEach(function (x) { x.classList.remove("active"); });
    btn.classList.add("active");
    document.querySelectorAll(".tab-panel").forEach(function (p) { p.classList.add("hidden"); });
    document.getElementById("tab-" + btn.dataset.tab).classList.remove("hidden");
    if (btn.dataset.tab === "monitor") muatMonitor();
    if (btn.dataset.tab === "siswa") muatSiswa();
    if (btn.dataset.tab === "datasiswa") muatDataSiswa();
    if (btn.dataset.tab === "ujian") muatUjianAdmin();
    if (btn.dataset.tab === "user") muatUsers();
    if (btn.dataset.tab === "hasil") muatHasil();
  });

  /* ===== MONITOR ===== */
  function infoStatusSiswa(st) {
    if (st === "ACTIVE") return { label: "Sedang mengerjakan ...", badge: "badge-green" };
    if (st === "SELESAI") return { label: "Selesai", badge: "badge-blue" };
    return { label: "Belum ujian", badge: "badge-slate" };
  }
  document.getElementById("btnRefreshMonitor").addEventListener("click", muatMonitor);
  document.getElementById("monStatus").addEventListener("change", renderMonitor);
  document.getElementById("monCari").addEventListener("input", renderMonitor);

  var monData = [];
  function renderMonitor() {
    var box = document.getElementById("monitorBox");
    if (!box) return;
    var q = (document.getElementById("monCari").value || "").toLowerCase().trim();
    var st = document.getElementById("monStatus").value;
    var list = monData.filter(function (s) {
      if (st && s.status !== st) return false;
      if (q) {
        var hay = [s.nis, s.username, s.kode_ujian].join(" ").toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
    if (!monData.length) { box.innerHTML = '<div class="card muted center">Belum ada siswa terdaftar.</div>'; return; }
    if (!list.length) { box.innerHTML = '<div class="muted center">Tidak ada siswa yang cocok.</div>'; return; }
    box.innerHTML = "<div class='table-wrap'><table class='data'><thead><tr><th>NIS</th><th>Username</th><th>Kode Ujian</th><th>Status</th><th>Login</th></tr></thead><tbody>" +
      list.map(function (s) {
        var sti = infoStatusSiswa(s.status);
        return "<tr><td>" + esc(s.nis) + "</td><td>" + esc(s.username) + "</td><td><code>" + esc(s.kode_ujian || "-") + "</code></td><td><span class='badge " + sti.badge + "'>" + sti.label + "</span></td><td class='muted'>" + (s.login_ts ? new Date(s.login_ts).toLocaleString() : "") + "</td></tr>";
      }).join("") + "</tbody></table></div>";
  }

  function muatMonitor() {
    Promise.all([AppAPI.call("get-progress"), AppAPI.call("get-ujian")]).then(function (rs) {
      monData = rs[0].data || [];
      renderMonitor();
    }).catch(function (err) {
      document.getElementById("monitorBox").innerHTML = '<div class="muted">' + esc(err.message) + '</div>';
    });
  }

  /* ===== RESET SISWA (antrean permintaan reset dari siswa) ===== */
  function muatSiswa() {
    AppAPI.call("get-reset-requests").then(function (res) {
      var list = res.data || [];
      var box = document.getElementById("siswaBox");
      if (!list.length) { box.innerHTML = '<div class="card muted center">Belum ada permintaan reset login.</div>'; return; }
      box.innerHTML = "<div class='table-wrap'><table class='data'><thead><tr><th>Nama</th><th>NIS</th><th>Kelas</th><th>Username</th><th>Kode Ujian</th><th>Diminta</th><th>Aksi</th></tr></thead><tbody>" +
        list.map(function (r) {
          return "<tr><td>" + esc(r.nama) + "</td><td>" + esc(r.nis || "-") + "</td><td>" + esc(r.kelas || "-") + "</td><td><code>" + esc(r.username) + "</code></td><td class='muted'>" + esc(r.kode_ujian || "-") + "</td><td class='muted'>" + (r.requested_at ? new Date(r.requested_at).toLocaleString() : "") + "</td>" +
            '<td><button class="btn btn-sm btn-outline" data-reset-username="' + esc(r.username) + '">Reset Login</button></td></tr>';
        }).join("") + "</tbody></table></div>";
    }).catch(function (err) {
      document.getElementById("siswaBox").innerHTML = '<div class="muted">' + esc(err.message) + "</div>";
    });
  }

  document.getElementById("btnRefreshReset").addEventListener("click", muatSiswa);

  document.getElementById("siswaBox").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-reset-username]");
    if (!b) return;
    window.__resetLogin(b.dataset.resetUsername);
  });

  /* ===== DATA SISWA (semua data upload Excel) ===== */
  var siswaData = [];
  function muatDataSiswa() {
    AppAPI.call("get-siswa").then(function (res) {
      if (!res.ok) { document.getElementById("dsBox").innerHTML = '<div class="muted">' + esc(res.error || "Gagal memuat data siswa") + "</div>"; return; }
      siswaData = res.data || [];
      isiFilterKelasSiswa();
      renderDataSiswa();
    }).catch(function (err) {
      document.getElementById("dsBox").innerHTML = '<div class="muted">' + esc(err.message) + "</div>";
    });
  }

  function isiFilterKelasSiswa() {
    var kelasSet = [...new Set(siswaData.map(function (s) { return s.kelas; }))].filter(Boolean);
    var sel = document.getElementById("dsKelas");
    var prev = sel.value;
    sel.innerHTML = '<option value="">Semua kelas</option>' +
      kelasSet.map(function (k) { return '<option value="' + esc(k) + '">' + esc(k) + "</option>"; }).join("");
    if (prev) sel.value = prev;
  }

  function filterDataSiswa() {
    var kelas = document.getElementById("dsKelas").value;
    var q = document.getElementById("dsCari").value.trim().toLowerCase();
    return siswaData.filter(function (s) {
      if (kelas && (s.kelas || "") !== kelas) return false;
      if (q) {
        var hay = ((s.nama || "") + " " + (s.nis || "") + " " + (s.username || "")).toLowerCase();
        if (hay.indexOf(q) < 0) return false;
      }
      return true;
    });
  }

  function renderDataSiswa() {
    var list = filterDataSiswa();
    var box = document.getElementById("dsBox");
    if (!list.length) {
      box.innerHTML = '<div class="muted center">' + (siswaData.length ? "Tidak ada data yang cocok dengan filter / pencarian." : "Belum ada data siswa. Upload .xlsx dari halaman Guru (tab Upload).") + "</div>";
      return;
    }
    box.innerHTML = "<table class='data'><thead><tr><th>Nama</th><th>NIS</th><th>Username</th><th>Kelas</th></tr></thead><tbody>" +
      list.map(function (s) {
        return "<tr><td>" + esc(s.nama) + "</td><td>" + esc(s.nis || "-") + "</td><td><code>" + esc(s.username) + "</code></td><td>" + (s.kelas ? "<span class='badge badge-slate'>" + esc(s.kelas) + "</span>" : "-") + "</td></tr>";
      }).join("") + "</tbody></table>";
  }

  document.getElementById("dsKelas").addEventListener("change", renderDataSiswa);
  document.getElementById("dsCari").addEventListener("input", renderDataSiswa);
  document.getElementById("btnRefreshSiswa").addEventListener("click", muatDataSiswa);

  /* ===== GENERATE KARTU SISWA ===== */
  var kartuData = [];
  var kartuJumlah = 10; // default 10 per halaman
  document.getElementById("btnGenerateKartu").addEventListener("click", function () {
    var kelas = document.getElementById("dsKelas").value;
    var q = document.getElementById("dsCari").value.trim().toLowerCase();
    var filtered = siswaData.filter(function (s) {
      if (kelas && (s.kelas || "") !== kelas) return false;
      if (q) {
        var hay = ((s.nama || "") + " " + (s.nis || "") + " " + (s.username || "")).toLowerCase();
        if (hay.indexOf(q) < 0) return false;
      }
      return true;
    });
    kartuData = filtered;
    if (!kartuData.length) {
      document.getElementById("kartuFilterInfo").innerHTML = '<div class="alert alert-warn">Tidak ada siswa yang cocok dengan filter / pencarian.</div>';
      document.getElementById("kartuJumlah").value = "10";
      document.getElementById("kartuPreview").innerHTML = "";
      document.getElementById("kartuPrintArea").className = "print-area kartu-grid kartu-grid--10";
      document.getElementById("kartuGenerate").style.display = "inline-block";
      document.getElementById("kartuCetak").style.display = "none";
      document.getElementById("kartuModal").classList.add("open");
      return;
    }
    document.getElementById("kartuFilterInfo").innerHTML = '<div class="alert alert-success">Menghasilkan kartu untuk ' + kartuData.length + ' siswa</div>';
    // Render preview kartu (tanpa password asli, hanya placeholder)
    document.getElementById("kartuNama").value = "";
    renderKartuPreview();
    document.getElementById("kartuJumlah").value = "10";
    document.getElementById("kartuGenerate").style.display = "inline-block";
    document.getElementById("kartuCetak").style.display = "none";
    document.getElementById("kartuModal").classList.add("open");
    document.getElementById("kartuNama").focus();
  });

  function renderKartuPreview() {
    var jumlah = parseInt(document.getElementById("kartuJumlah").value) || 6;
    var gridClass = jumlah === 8 ? "kartu-grid--8" : (jumlah === 10 ? "kartu-grid--10" : "kartu-grid--6");
    document.getElementById("kartuPrintArea").className = "print-area kartu-grid " + gridClass;
    var namaUjian = document.getElementById("kartuNama").value.trim() || "Ujian Matematika";
    var html = kartuData.map(function (s) {
      // Preview: password masih akan digenerate, jadi kita tampilkan placeholder
      var passwordPlaceholder = "••••••••";
      return "<div class='kartu'>" +
        "<div class='card-header'>" + esc(namaUjian) + "</div>" +
        "<div class='card-body'>" +
          "<table class='info-table'>" +
            "<tr><td class='info-label'>Nama</td><td class='info-colon'>:</td><td class='info-value'>" + esc(s.nama) + "</td></tr>" +
            "<tr><td class='info-label'>NIS</td><td class='info-colon'>:</td><td class='info-value'>" + esc(s.nis || "-") + "</td></tr>" +
            "<tr><td class='info-label'>Kelas</td><td class='info-colon'>:</td><td class='info-value'>" + esc(s.kelas || "-") + "</td></tr>" +
          "</table>" +
          "<div class='credentials'>" +
            "<span class='cred-item'>User: <span class='cred-val'>" + esc(s.username) + "</span></span>" +
            "<span class='cred-item'>Pass: <span class='cred-val'>" + passwordPlaceholder + "</span></span>" +
          "</div>" +
        "</div>" +
      "</div>";
    }).join("");
    document.getElementById("kartuPrintArea").innerHTML = html;
  }

  function renderKartuPrint(jumlah) {
    var gridClass = jumlah === 8 ? "kartu-grid--8" : (jumlah === 10 ? "kartu-grid--10" : "kartu-grid--6");
    document.getElementById("kartuPrintArea").className = "print-area kartu-grid " + gridClass;
    var namaUjian = document.getElementById("kartuNama").value.trim() || "Ujian Matematika";
    var html = kartuData.map(function (s) {
      var password = s.password || "••••••••";
      return "<div class='kartu'>" +
        "<div class='card-header'>" + esc(namaUjian) + "</div>" +
        "<div class='card-body'>" +
          "<table class='info-table'>" +
            "<tr><td class='info-label'>Nama</td><td class='info-colon'>:</td><td class='info-value'>" + esc(s.nama) + "</td></tr>" +
            "<tr><td class='info-label'>NIS</td><td class='info-colon'>:</td><td class='info-value'>" + esc(s.nis || "-") + "</td></tr>" +
            "<tr><td class='info-label'>Kelas</td><td class='info-colon'>:</td><td class='info-value'>" + esc(s.kelas || "-") + "</td></tr>" +
          "</table>" +
          "<div class='credentials'>" +
            "<span class='cred-item'>User: <span class='cred-val'>" + esc(s.username) + "</span></span>" +
            "<span class='cred-item'>Pass: <span class='cred-val'>" + password + "</span></span>" +
          "</div>" +
        "</div>" +
      "</div>";
    }).join("");
    document.getElementById("kartuPrintArea").innerHTML = html;
  }

  document.getElementById("kartuJumlah").addEventListener("change", function () {
    var jumlah = parseInt(this.value) || 6;
    renderKartuPrint(jumlah);
    kartuJumlah = jumlah;
  });

  document.getElementById("kartuNama").addEventListener("input", function () {
    renderKartuPreview();
  });

  document.getElementById("kartuGenerate").addEventListener("click", function () {
    var usernames = kartuData.map(function (s) { return s.username; });
    AppAPI.call("generate-kartu", { usernames: usernames }).then(function (res) {
      if (!res.ok) {
        toast(res.error || "Gagal generate kartu");
        return;
      }
      var info = res.data;
      toast("Berhasil generate kartu untuk " + info.total + " siswa");
      // Update password di kartuData dari respons RPC
      kartuData.forEach(function (s) {
        var rec = info.updated.find(function (u) { return u.username === s.username; });
        if (rec) s.password = rec.password;
      });
      // Render kartu print dengan password asli
      renderKartuPrint(kartuJumlah);
      // Tampilkan tombol cetak & sembunyikan tombol generate
      document.getElementById("kartuGenerate").style.display = "none";
      document.getElementById("kartuCetak").style.display = "inline-block";
      // Buka dialog cetak (Simpan sebagai PDF) langsung
      window.print();
    }).catch(function (err) {
      toast(err.message);
    });
  });

  document.getElementById("kartuCetak").addEventListener("click", function () {
    window.print();
  });

  document.getElementById("kartuClose").addEventListener("click", function () {
    document.getElementById("kartuModal").classList.remove("open");
  });

  document.getElementById("kartuCancel").addEventListener("click", function () {
    document.getElementById("kartuModal").classList.remove("open");
  });

  /* Mengatur jumlah kartu per halaman awal */
  document.getElementById("kartuJumlah").value = "10";

  /* ===== RESET LOGIN ===== */
  window.__resetLogin = function (username) {
    var pesan = "Reset login siswa \"" + username + "\"?\n\n" +
      "Sesi aktif dibebaskan dan permintaan ini dihapus dari daftar.\n" +
      "Siswa bisa login lagi dan lanjut dari jawaban terakhir beserta sisa waktu.\n" +
      "Lanjutkan?";
    if (!window.confirm(pesan)) return;
    AppAPI.call("reset-login", { username: username }).then(function (res) {
      if (!res.ok) { toast(res.error || "Gagal reset login"); return; }
      toast("Login direset — siswa bisa masuk lagi");
      muatSiswa();
    }).catch(function (err) { toast(err.message); });
  };

  /* ===== UJIAN (aktifkan + token) ===== */
  function muatUjianAdmin() {
    AppAPI.call("get-ujian").then(function (res) {
       var ujian = res.data || [];
       var box = document.getElementById("ujianBox");
       if (!ujian.length) { box.innerHTML = '<div class="card muted center">Belum ada ujian dibuat guru.</div>'; return; }
       box.innerHTML = "<div class='table-wrap'><table class='data'><thead><tr><th>Nama</th><th>Kode</th><th>Jenjang</th><th>Status</th><th>Token</th><th>Aksi</th></tr></thead><tbody>" +
         ujian.map(function (u) {
           var badge = u.status === "aktif" ? "badge-green" : "badge-slate";
           var label = u.status === "aktif" ? "Aktif" : "Draft";
           var btn;
           if (u.status === "aktif") {
             btn = '<button class="btn btn-sm btn-success" data-selesai-ujian="' + esc(u.id) + '">Selesai</button>';
           } else {
             btn = '<button class="btn btn-sm" data-aktifkan-ujian="' + esc(u.id) + '">Aktifkan &amp; Generate Token</button>';
           }
           var token = u.status === "aktif" && u.token
             ? "<code style='background:#f1f5f9;padding:2px 8px;border-radius:6px;font-weight:700;letter-spacing:1px'>" + esc(u.token) + "</code>"
             : "<span class='muted'>—</span>";
           return "<tr><td>" + esc(u.nama) + "</td><td><code>" + esc(u.kode) + "</code></td><td>" + esc(u.jenjang) + "</td><td><span class='badge " + badge + "'>" + label + "</span></td><td>" + token + "</td><td>" + btn + "</td></tr>";
         }).join("") + "</tbody></table></div>";
    });
  }

  document.getElementById("ujianBox").addEventListener("click", function (e) {
    var a = e.target.closest("button[data-aktifkan-ujian]");
    if (a) { window.__aktifkanUjian(a.dataset.aktifkanUjian); return; }
    var s = e.target.closest("button[data-selesai-ujian]");
    if (s) { window.__selesaiUjian(s.dataset.selesaiUjian); return; }
  });

  window.__aktifkanUjian = function (id) {
    AppAPI.call("aktifkan-ujian", { id: id }).then(function (res) {
      if (!res.ok) { toast(res.error); return; }
      toast("Ujian aktif — token: " + res.data.token);
      muatUjianAdmin();
    }).catch(function (err) { toast(err.message); });
  };

  window.__selesaiUjian = function (id) {
    AppAPI.call("selesai-ujian", { id: id }).then(function (res) {
      if (!res.ok) { toast(res.error); return; }
      toast("Ujian diselesaikan — siswa tidak bisa mulai lagi");
      muatUjianAdmin();
    }).catch(function (err) { toast(err.message); });
  };

  /* ===== USER GURU ===== */
  document.getElementById("btnTambahUser").addEventListener("click", function () {
    var u = document.getElementById("nuUser").value.trim();
    var p = document.getElementById("nuPass").value;
    if (!u || !p) { toast("Isi username & password"); return; }
    AppAPI.call("tambah-user", { user: { username: u, passHash: p, role: "guru", aktif: true } }).then(function (res) {
      if (!res.ok) { toast(res.error || "Gagal membuat akun guru"); return; }
      toast("Akun guru " + u + " dibuat");
      document.getElementById("nuUser").value = ""; document.getElementById("nuPass").value = "";
      muatUsers();
    }).catch(function (err) { toast(err.message); });
  });

  function esc(s) {
    return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function muatUsers() {
    AppAPI.call("get-users").then(function (res) {
      var box = document.getElementById("userList");
      if (!res.ok) { box.innerHTML = '<div class="muted">' + (res.error || "Gagal memuat daftar guru") + '</div>'; return; }
      var list = (res.data || []).filter(function (x) { return x.role === "guru"; });
      if (!list.length) { box.innerHTML = '<div class="muted">Belum ada akun guru.</div>'; return; }
      box.innerHTML = "<table class='data'><thead><tr><th>Username</th><th>Password</th><th>Role</th><th>Status</th><th>Aksi</th></tr></thead><tbody>" +
        list.map(function (u) {
          var hapus = "<button class='btn btn-sm btn-danger' data-hapus-user='" + esc(u.username) + "'>Hapus</button>";
          var pass = u.pass || u.passHash || "";
          var isi = pass ? "<span class='pass-val' data-pass='" + esc(pass) + "' data-masked='\u2022\u2022\u2022\u2022\u2022\u2022' data-revealed='0'>\u2022\u2022\u2022\u2022\u2022\u2022</span> <button class='btn btn-sm btn-ghost' data-toggle-pass='" + esc(u.username) + "' title='Lihat/sembunyikan password'><i class='fa-solid fa-eye'></i></button>" : "<span class='muted'>\u2014</span>";
          return "<tr><td>" + esc(u.username) + "</td><td>" + isi + "</td><td>" + esc(u.role) + "</td><td><span class='badge " + (u.aktif ? "badge-green" : "badge-red") + "'>" + (u.aktif ? "aktif" : "nonaktif") + "</span></td><td>" + hapus + "</td></tr>";
        }).join("") + "</tbody></table>";
    }).catch(function (err) {
      document.getElementById("userList").innerHTML = '<div class="muted">' + esc(err.message) + '</div>';
    });
  }

  document.getElementById("userList").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-toggle-pass]");
    if (b) {
      var td = b.closest("td");
      var span = td && td.querySelector(".pass-val");
      if (!span) return;
      if (span.dataset.revealed === "1") {
        span.textContent = span.dataset.masked;
        span.dataset.revealed = "0";
        b.querySelector("i").className = "fa-solid fa-eye";
      } else {
        span.textContent = span.dataset.pass;
        span.dataset.revealed = "1";
        b.querySelector("i").className = "fa-solid fa-eye-slash";
      }
      return;
    }
    var h = e.target.closest("button[data-hapus-user]");
    if (h) window.__hapusUser(h.dataset.hapusUser);
  });

  window.__hapusUser = function (username) {
    if (username === "admin") { toast("Akun admin utama tidak bisa dihapus"); return; }
    if (!confirm("Hapus akun guru '" + username + "'? Tindakan ini tidak bisa dibatalkan.")) return;
    AppAPI.call("hapus-user", { username: username }).then(function (res) {
      if (!res.ok) { toast(res.error || "Gagal menghapus akun"); return; }
      toast("Akun guru " + username + " dihapus");
      muatUsers();
    }).catch(function (err) { toast(err.message); });
  };

  /* ===== HASIL ===== */
  var hasilData = [];
  function muatHasil() {
    AppAPI.call("get-hasil").then(function (res) {
      hasilData = res.data || [];
      isiFilterHasil();
      renderHasil();
    });
  }

  function isiFilterHasil() {
    var kodeSet = [...new Set(hasilData.map(function (h) { return h.kode_ujian; }))].filter(Boolean);
    var kelasSet = [...new Set(hasilData.map(function (h) { return h.kelas; }))].filter(Boolean);
    document.getElementById("hfKode").innerHTML = '<option value="">Semua kode ujian</option>' +
      kodeSet.map(function (k) { return '<option value="' + esc(k) + '">' + esc(k) + "</option>"; }).join("");
    document.getElementById("hfKelas").innerHTML = '<option value="">Semua kelas</option>' +
      kelasSet.map(function (k) { return '<option value="' + esc(k) + '">' + esc(k) + "</option>"; }).join("");
  }

  function filterHasil() {
    var kode = document.getElementById("hfKode").value;
    var kelas = document.getElementById("hfKelas").value;
    var q = document.getElementById("hfCari").value.trim().toLowerCase();
    return hasilData.filter(function (h) {
      if (kode && (h.kode_ujian || "") !== kode) return false;
      if (kelas && (h.kelas || "") !== kelas) return false;
      if (q) {
        var hay = ((h.nama || "") + " " + (h.nis || "")).toLowerCase();
        if (hay.indexOf(q) < 0) return false;
      }
      return true;
    });
  }

  function renderHasil() {
    var list = filterHasil();
    var box = document.getElementById("hasilBox");
    if (!list.length) {
      box.innerHTML = '<div class="card muted center">' + (hasilData.length ? "Tidak ada hasil yang cocok dengan filter." : "Belum ada hasil.") + "</div>";
      return;
    }
    box.innerHTML = "<table class='data'><thead><tr><th>Nama</th><th>NIS</th><th>Kelas</th><th>Kode Ujian</th><th>Benar</th><th>Total</th><th>Nilai</th><th>Waktu</th></tr></thead><tbody>" +
      list.map(function (h) {
        return "<tr><td>" + esc(h.nama) + "</td><td>" + esc(h.nis) + "</td><td>" + esc(h.kelas || "-") + "</td><td>" + esc(h.kode_ujian || "-") + "</td><td>" + h.benar + "</td><td>" + h.total + "</td><td><b>" + h.nilai + "</b></td><td class='muted'>" + (h.ts ? new Date(h.ts).toLocaleString() : "") + "</td></tr>";
      }).join("") + "</tbody></table>";
  }

  document.getElementById("hfKode").addEventListener("change", renderHasil);
  document.getElementById("hfKelas").addEventListener("change", renderHasil);
  document.getElementById("hfCari").addEventListener("input", renderHasil);

  function barisHasil(list) {
    return list.map(function (h) {
      return {
        "Nama": h.nama || "",
        "NIS": h.nis || "",
        "Kelas": h.kelas || "-",
        "Kode Ujian": h.kode_ujian || "-",
        "Benar": h.benar,
        "Total": h.total,
        "Nilai": h.nilai,
        "Waktu": h.ts ? new Date(h.ts).toLocaleString() : ""
      };
    });
  }

  function exportHasilXls() {
    var list = filterHasil();
    if (!list.length) { toast("Tidak ada data hasil untuk diexport."); return; }
    if (typeof XLSX === "undefined") { toast("Library export belum termuat."); return; }
    var usedNames = {};
    var sheetCount = 0;
    function uniqueName(base) {
      var name = String(base || "Sheet").replace(/[\\\/\?\*\[\]:]/g, "_").slice(0, 31);
      var n = name, k = 1;
      while (usedNames[n]) { k++; n = name.slice(0, 27) + "(" + k + ")"; }
      usedNames[n] = true;
      return n;
    }
    function addSheet(rows, sheetName) {
      if (!rows.length) return;
      var ws = XLSX.utils.json_to_sheet(rows);
      ws["!cols"] = [{ wch: 24 }, { wch: 12 }, { wch: 14 }, { wch: 16 }, { wch: 8 }, { wch: 8 }, { wch: 8 }, { wch: 20 }];
      XLSX.utils.book_append_sheet(wb, ws, uniqueName(sheetName));
      sheetCount++;
    }
    var wb = XLSX.utils.book_new();
    addSheet(barisHasil(list), "Semua Hasil");
    [...new Set(list.map(function (h) { return h.kelas; }))].filter(Boolean).forEach(function (k) {
      addSheet(barisHasil(list.filter(function (h) { return h.kelas === k; })), "Kelas " + k);
    });
    [...new Set(list.map(function (h) { return h.kode_ujian; }))].filter(Boolean).forEach(function (k) {
      addSheet(barisHasil(list.filter(function (h) { return h.kode_ujian === k; })), "Kode " + k);
    });
    XLSX.writeFile(wb, "hasil-ujian-" + new Date().toISOString().slice(0, 10) + ".xlsx");
    toast("Export " + list.length + " baris ke " + sheetCount + " sheet sukses.");
  }

  document.getElementById("btnExportHasil").addEventListener("click", exportHasilXls);

  /* ===== AUTO-LOGIN jika sesi admin ada =====
   * Sesi divalidasi ke server dulu — jika sudah tidak berlaku
   * (mis. direset/dibersihkan), paksa login ulang. */
  (function () {
    var s = AppSession.data();
    if (!s || s.role !== "admin") return;
    AppAPI.call("get-progress").then(function (res) {
      if (res.ok) {
        masukDashboard(s);
      } else {
        AppSession.clear();
        document.getElementById("adminMsg").textContent = "Sesi berakhir, silakan login ulang.";
      }
    }).catch(function () {
      AppSession.clear();
      document.getElementById("adminMsg").textContent = "Sesi berakhir, silakan login ulang.";
    });
  })();
})();
</script>
</body>
</html>
